databases:
  - name: treatment-plan-db
    databaseName: treatment_plan
    plan: free

services:
  # --- API (Express + PostgreSQL) ---------------------------------------
  - type: web
    runtime: node
    name: treatment-plan-api
    rootDir: server
    plan: free
    # --include=dev: Render sets NODE_ENV=production, which makes `npm ci` skip
    # devDependencies by default — but `typescript` (build) lives there.
    buildCommand: npm ci --include=dev && npm run build
    # `npm start` runs the `prestart` script first (node dist/migrate.js up),
    # so pending SQL migrations are applied before the API boots. If migrations
    # fail, `npm start` aborts and the previous version stays live.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: treatment-plan-db
          property: connectionString
      - key: DATABASE_SSL
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        value: https://treatment-plan-app.onrender.com
      # Zoho — set these in the Render dashboard (do not commit secrets).
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REDIRECT_URI
        value: https://treatment-plan-api.onrender.com/api/zoho/callback
      - key: ZOHO_ACCOUNTS_BASE
        sync: false
      - key: ZOHO_API_BASE
        sync: false
      - key: SIGNUP_ALLOWED_DOMAINS
        sync: false

  # --- Static frontend -------------------------------------------------
  - type: web
    runtime: static
    name: treatment-plan-app
    # --include=dev: tsc / vite / @vitejs-plugin-react are devDependencies.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://treatment-plan-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
